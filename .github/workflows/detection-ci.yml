name: Detection CI (Template)

on:
  push:
    branches: [main]
    paths:
      - 'detections/**'
      - 'tests/**'
      - '.github/workflows/detection-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'detections/**'
      - 'tests/**'

jobs:
  validate-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sigma check
        run: sigma check --fail-on-issues detections/

      - name: Pytest
        run: pytest -v